<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rex Capture 原型 · Place Sunnybank</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--g:#16a34a;--r:#dc2626;--gr:#9ca3af;--o:#8b5cf6;--y:#f59e0b;--b:#0b5d8a;--bg:#eef1f5;--line:#e5e7eb;--mut:#6b7280;--ink:#111827}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.topnav{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#0f172a;color:#fff}
.topnav b{font-size:15px}.topnav .sp{flex:1}
.seg{display:flex;background:#1e293b;border-radius:8px;padding:3px}
.seg button{border:0;background:none;color:#cbd5e1;padding:6px 14px;border-radius:6px}
.seg button.on{background:#fff;color:#0f172a;font-weight:600}
.proto-tag{font-size:12px;color:#94a3b8}
/* ---------- phone view ---------- */
#vMobile{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:24px}
.phone{width:410px;height:864px;border-radius:56px;background:#111;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.25);flex:none}
.screen{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600;flex:none;z-index:5;background:#fff}
.net{font-size:12px;padding:2px 8px;border-radius:10px;background:#dcfce7;color:#166534;cursor:pointer}
.net.off{background:#fee2e2;color:#991b1b}
.app{flex:1;position:relative;overflow:hidden;isolation:isolate;z-index:0}
.page{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.page.on{display:flex}
.scroll{flex:1;overflow:auto;padding:12px 14px 20px}
.tabbar{height:78px;flex:none;display:flex;border-top:1px solid var(--line);background:#fff;padding-bottom:18px;z-index:5}
.tabbar button{flex:1;border:0;background:none;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.tabbar button i{font-style:normal;font-size:20px}
.tabbar button.on{color:var(--b);font-weight:600}
.badge{position:absolute;top:4px;right:22px;background:var(--y);color:#fff;font-size:10px;border-radius:9px;padding:1px 5px}
h2.pt{font-size:22px;margin:4px 0 10px}
.srch{display:flex;gap:6px;padding:6px 12px 4px;background:#fff}
.srch input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#f9fafb}
.srch button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 8px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px;font-size:12px;white-space:nowrap}
.chip.on{background:var(--b);color:#fff;border-color:var(--b)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.d-green{background:var(--g)}.d-red{background:var(--r)}.d-grey{background:var(--gr)}.d-other{background:var(--o)}
#map{flex:1}
.cov{position:absolute;left:12px;top:12px;z-index:500;background:#fff;border-radius:10px;padding:6px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.cov b{color:var(--g)}
.legend{position:absolute;left:12px;bottom:12px;z-index:500;background:rgba(255,255,255,.95);border-radius:10px;padding:6px 10px;font-size:11px;line-height:1.7;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.fab{position:absolute;right:12px;bottom:14px;z-index:500;width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:18px}
.pin{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);position:relative}
.pin.green{background:var(--g)}.pin.red{background:var(--r)}.pin.grey{background:var(--gr)}.pin.other{background:var(--o)}
.pin.known::after{content:"";position:absolute;left:3px;top:3px;width:4px;height:4px;border-radius:50%;background:#fff}
.pin.pending{box-shadow:0 0 0 3px var(--y)}
.pin.sel{transform:scale(1.5);z-index:999}
.pin-dnk{font-size:13px;line-height:14px;text-align:center;width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.pin-cx{width:22px;height:22px;border-radius:6px;background:#fff;border:2px solid #374151;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* sheet */
.shade{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:20;display:none}
.shade.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:80%;background:#fff;border-radius:18px 18px 0 0;z-index:21;transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:0 -6px 20px rgba(0,0,0,.15)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#d1d5db;margin:8px auto 2px;flex:none}
.sh-body{overflow:auto;padding:4px 16px 16px}
.sh-addr{font-size:19px;font-weight:700;margin:6px 0 2px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:10px;background:#f3f4f6}
.sec{margin-top:12px}
.sec h4{margin:0 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.tp{background:#fffbeb;border-color:#fde68a}
.src{font-size:10px;background:#f59e0b;color:#fff;border-radius:4px;padding:1px 5px;margin-left:6px}
.note{font-size:13px;border-left:3px solid #cbd5e1;padding:2px 0 2px 8px;margin-bottom:8px}
.note small{display:block;color:var(--mut);font-size:11px}
.qr{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qr button{border:1px solid var(--line);background:#f9fafb;border-radius:10px;padding:9px 4px;font-size:13px}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.flag{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;font-size:12px}
.flag.on{background:#fee2e2;border-color:#fca5a5;color:#991b1b;font-weight:600}
.mic{position:sticky;bottom:0;background:linear-gradient(transparent,#fff 30%);padding:12px 0 4px;display:flex;justify-content:center}
.micbtn{width:100%;border:0;border-radius:16px;background:var(--b);color:#fff;font-size:17px;font-weight:600;padding:16px;user-select:none;-webkit-user-select:none;touch-action:none}
.micbtn:active{background:#084766}
.lnk{color:var(--b);font-size:13px;background:none;border:0;padding:0}
/* modal */
.modal{position:absolute;inset:0;background:#fff;z-index:30;display:none;flex-direction:column}
.modal.on{display:flex}
.mhead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
.mhead b{flex:1;font-size:16px}
.mhead button{border:0;background:none;color:var(--b);font-size:15px}
.rec{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0b1220;color:#fff;padding:20px}
.wave{display:flex;gap:4px;align-items:center;height:60px}
.wave span{width:5px;background:#38bdf8;border-radius:3px;animation:w 0.9s infinite ease-in-out}
@keyframes w{0%,100%{height:10px}50%{height:56px}}
.bigmic{width:110px;height:110px;border-radius:50%;border:0;background:#ef4444;color:#fff;font-size:42px;box-shadow:0 0 0 12px rgba(239,68,68,.25);touch-action:none;user-select:none}
.samples{display:flex;flex-direction:column;gap:6px;width:100%}
.samples button{border:1px solid #334155;background:#111a2e;color:#e2e8f0;border-radius:10px;padding:8px;font-size:12px;text-align:left}
.samples button.on{border-color:#38bdf8;background:#0c2a44}
.spin{width:38px;height:38px;border:4px solid #e5e7eb;border-top-color:var(--b);border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.fld{margin-bottom:9px}
.fld label{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#fff}
.fld.low input,.fld.low select{background:#fef9c3;border-color:#facc15}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.banner{border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:10px}
.b-ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.b-info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.b-warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.b-bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.trans{font-size:13px;background:#f8fafc;border-radius:10px;padding:8px 10px;color:#334155;margin-bottom:10px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:3px 9px;font-size:12px;margin:0 4px 4px 0;cursor:pointer;background:#fff}
.tag.on{background:#e0f2fe;border-color:#7dd3fc;color:#075985}
.acts{font-size:12px;color:#334155;margin:0;padding-left:18px}
.mfoot{padding:10px 14px 24px;border-top:1px solid var(--line);display:flex;gap:8px;flex:none}
.btn{border:0;border-radius:12px;padding:13px;font-weight:600;font-size:15px}
.btn.pri{background:var(--b);color:#fff;flex:1}
.btn.sec2{background:#f3f4f6;color:#111}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:40;background:#111827;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.wm{position:absolute;inset:0;pointer-events:none;z-index:45;opacity:.07;background-repeat:repeat}
.lst{user-select:none;-webkit-user-select:none}
.li{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.li .a{flex:1;min-width:0}
.li .a b{font-size:14px;display:block}
.li .a span{font-size:12px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{font-size:11px;color:var(--mut);text-align:right}
.ofi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.live{font-size:10px;background:#dc2626;color:#fff;border-radius:4px;padding:1px 5px;margin-left:4px}
.chk{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px;margin-bottom:6px}
.chk.on{background:#eff6ff;border-color:#93c5fd}
.paper{background:#fdfcf7;border:1px solid #e7e2d0;border-radius:6px;padding:10px;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:12px;color:#1e3a8a;transform:rotate(-1deg);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.paper table{width:100%;border-collapse:collapse}.paper td,.paper th{border:1px solid #cbd5e1;padding:3px;font-size:11px}
.rv{width:100%;border-collapse:collapse;font-size:12px}
.rv td,.rv th{border-bottom:1px solid var(--line);padding:5px 3px;text-align:left}
.rv td.low{background:#fef9c3}
.rv input{width:100%;border:0;background:transparent;font-size:12px;padding:0}
.ov{position:absolute;inset:0;z-index:50;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;gap:14px}
.ov.on{display:flex}
.ms{border:1px solid #d1d5db;background:#fff;border-radius:6px;padding:11px 16px;font-weight:600;display:flex;gap:10px;align-items:center}
/* notes panel */
.notes{width:400px;background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 4px 14px rgba(0,0,0,.06);font-size:14px;line-height:1.65;position:sticky;top:20px}
.notes h3{margin:0 0 6px;font-size:17px}
.notes .pdf{font-size:12px;color:var(--b);background:#e0f2fe;border-radius:6px;padding:2px 7px;display:inline-block;margin-bottom:8px}
.notes ul{padding-left:18px;margin:6px 0}
.notes .tip{background:#f8fafc;border-radius:8px;padding:8px 10px;font-size:13px;color:#475569;margin-top:10px}
/* ---------- admin ---------- */
#vAdmin{display:none;min-height:calc(100vh - 52px)}
.adm{display:flex;min-height:calc(100vh - 52px)}
.side{width:220px;background:#fff;border-right:1px solid var(--line);padding:16px 10px;flex:none}
.side .brand{font-weight:700;padding:4px 10px 14px;font-size:15px}
.side button{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;color:#374151;font-size:14px}
.side button.on{background:#e0f2fe;color:#075985;font-weight:600}
.side .cnt{background:#ef4444;color:#fff;border-radius:9px;font-size:11px;padding:1px 7px}
.main{flex:1;padding:22px 28px;overflow:auto}
.main h1{font-size:22px;margin:0 0 4px}
.main .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.2fr 1fr}
.box{background:#fff;border-radius:12px;padding:16px;border:1px solid var(--line)}
.kpi b{font-size:26px;display:block}.kpi span{color:var(--mut);font-size:12px}
.bar{height:10px;background:#f3f4f6;border-radius:5px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
table.t{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.t th{text-align:left;background:#f9fafb;color:#6b7280;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 10px;border-bottom:1px solid #f3f4f6;vertical-align:top}
.pill{font-size:11px;border-radius:10px;padding:2px 8px;background:#f3f4f6}
.p-ok{background:#dcfce7;color:#166534}.p-bad{background:#fee2e2;color:#991b1b}.p-warn{background:#fef3c7;color:#92400e}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px}
.tabs button.on{background:#0f172a;color:#fff;border-color:#0f172a}
.ab{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;font-size:12px;margin-right:4px}
.ab.pri{background:var(--b);color:#fff;border-color:var(--b)}
.ab.dan{background:#fff;color:#b91c1c;border-color:#fecaca}
#admMap{height:520px;border-radius:12px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f3f4f6;font-size:14px}
.setrow small{display:block;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div class="topnav">
  <b>Rex Capture · 原型</b><span class="proto-tag">Place Sunnybank · 全部为模拟数据，不连接 Rex</span>
  <span class="sp"></span>
  <div class="seg"><button id="sw1" class="on" onclick="switchView('m')">经纪人 App（iPhone）</button><button id="sw2" onclick="switchView('a')">管理后台（Web）</button></div>
</div>

<!-- ================= MOBILE ================= -->
<div id="vMobile">
 <div class="phone"><div class="screen" id="screen">
  <div class="status"><span>9:41</span><span class="net" id="net" onclick="toggleNet()" title="点击切换在线/离线">4G ●</span></div>
  <div class="app">
   <div class="page on" id="pg-map">
     <div class="srch"><input id="q" placeholder="Search street, e.g. Gager St" onkeydown="if(event.key==='Enter')doSearch()"><button onclick="doSearch()">🔍</button><button onclick="go('list')" title="List">☰</button></div>
     <div class="chips" id="chipsMap"></div>
     <div style="position:relative;flex:1;display:flex">
       <div id="map"></div>
       <div class="cov" id="cov"></div>
       <div class="legend"><span class="dot d-green"></span> Owner in Rex　<span class="dot d-red"></span> No owner<br><span class="dot d-grey"></span> Not matched　<span class="dot d-other"></span> Other agent<br>◉ Owner name known · ⛔ Do not knock · ▢ Units</div>
       <button class="fab" onclick="nearMe()" title="Near me">➤</button>
     </div>
   </div>
   <div class="page" id="pg-list"></div>
   <div class="page" id="pg-ofi"></div>
   <div class="page" id="pg-cap"></div>
   <div class="page" id="pg-me"></div>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
  <div class="shade" id="shade" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet"></div>
  <div class="modal" id="modal"></div>
  <div class="toast" id="toast"></div>
  <div class="wm" id="wm"></div>
  <div class="ov on" id="login">
    <div style="font-size:44px">🏠</div>
    <div style="font-size:24px;font-weight:700">Rex Capture</div>
    <div style="color:var(--mut);font-size:14px">Place Sunnybank</div>
    <button class="ms" onclick="signIn()"><span style="display:grid;grid-template-columns:9px 9px;gap:2px"><i style="background:#f25022;height:9px"></i><i style="background:#7fba00;height:9px"></i><i style="background:#00a4ef;height:9px"></i><i style="background:#ffb900;height:9px"></i></span>Sign in with Microsoft</button>
    <div style="font-size:12px;color:var(--mut)">Microsoft 365 single sign-on + MFA · no separate password</div>
  </div>
  <div class="ov" id="revoked">
    <div style="font-size:44px">🔒</div>
    <div style="font-size:20px;font-weight:700">Access removed</div>
    <div style="color:var(--mut);font-size:14px" id="revMsg"></div>
  </div>
 </div></div>
 <div class="notes" id="notes"></div>
</div>

<!-- ================= ADMIN ================= -->
<div id="vAdmin"><div class="adm">
  <div class="side" id="side"></div>
  <div class="main" id="amain"></div>
</div></div>

<script>
/* ===================== DATA ===================== */
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const pick = a => a[Math.floor(rnd() * a.length)];
const TODAY = new Date('2026-11-02');
const ME = { name: 'Kevin Zhang', team: 'Team Owen Chen' };
const TEAM = ['Kevin Zhang', 'Natalie Wong', 'Owen Chen'];
const NAMES = ['Mary Chen','David Liu','Grace Huang','Peter Nguyen','Linda Wang','James Smith','Karen Lee','Michael Brown','Helen Zhou','Tony Tran','Susan Taylor','Wei Zhang','Emily Wilson','Jack Ho','Anna Lin','Robert Jones','Cindy Wu','Daniel Kim','Fiona Ma','George Chan'];
const NOTE_TXT = ['Owner-occupier, happy where they are. Check again next year.','Spoke to wife, husband handles property matters.','Interested in recent sales on the street. Sent CMA.','Renovated kitchen 2023. Might upsize in 2 years.','Left card, no answer.','Investor owner, tenant on lease until March.','Asked about appraisal after Christmas.'];
const STREETS = [
  { name: 'Mains Rd', a: [-27.5702, 153.0566], b: [-27.5902, 153.0579], n: 22 },
  { name: 'McCullough St', a: [-27.5756, 153.0525], b: [-27.5763, 153.0690], n: 24 },
  { name: 'Gager St', a: [-27.5811, 153.0597], b: [-27.5816, 153.0706], n: 16 },
  { name: 'Lister St', a: [-27.5851, 153.0587], b: [-27.5857, 153.0700], n: 16 },
  { name: 'Turton St', a: [-27.5768, 153.0627], b: [-27.5900, 153.0634], n: 18 },
  { name: 'Dillon St', a: [-27.5716, 153.0642], b: [-27.5719, 153.0722], n: 10 },
];
const daysAgo = d => new Date(TODAY - d * 864e5);
const fmt = d => d ? d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const props = []; let pid = 1;
function mkProp(street, num, lat, lng, unit) {
  const x = rnd();
  const status = x < .42 ? 'green' : x < .86 ? 'red' : x < .93 ? 'grey' : 'other';
  const p = { id: pid++, street, num, unit, lat, lng, status, suburb: 'Sunnybank',
    addr: (unit ? unit + '/' : '') + num + ' ' + street,
    tp: status !== 'grey' && rnd() < .72 ? pick(NAMES) : null,
    tpSale: new Date(1996 + Math.floor(rnd() * 29), Math.floor(rnd() * 12), 1 + Math.floor(rnd() * 27)),
    contacts: [], notes: [], lastVisit: rnd() < .55 ? daysAgo(Math.floor(rnd() * 200)) : null, lastResult: null,
    dnk: rnd() < .04, junk: rnd() < .05, pending: false };
  if (status === 'green') {
    const owner = pick(TEAM);
    p.contacts.push({ name: p.tp && rnd() < .7 ? p.tp : pick(NAMES), role: rnd() < .8 ? 'Owner' : 'Landlord', mobile: '04' + Math.floor(10000000 + rnd() * 89999999), owner, dnc: rnd() < .06 });
  }
  if (status === 'green' || (status === 'red' && rnd() < .5)) {
    const k = 1 + Math.floor(rnd() * 3);
