<style>
/* AxleoCollect Draft 2. Bright, light, warm: Mist background, white cards, Honey primary with Core Ink text, Signal Orange as the one accent, Azure as the calm secondary. No dark panels, no teal, no black. Company theme overrides the brand tokens only; map status colours never change. */
:root{
  --bg:#F6F7FA; --surface:#ffffff; --surface2:#EEF1F6; --surface3:#E4E8EF;
  --fg:#13233F; --fg2:#5B6475; --muted:#8A94A6; --line:#E4E8EF;
  --brand:#FFB02E; --brand-fg:#13233F; --accent:#FF6B2C; --accent-fg:#ffffff; --azure:#2B95F5;
  --mic:#FF6B2C; --mic-fg:#ffffff;
  --green:#22A06B; --orange:#FF8A3D; --sky:#5BB8F5; --steel:#8A94A6; --gold:#E0A100; --navy:#1C3F8F; --red:#D7263D; --pink:#F8C6D0; --purple:#E9DDFB;
  --hot:#FF6B2C; --warm:#FFC94D; --cold:#2B95F5;
  --yr0:#E4E8EF; --yr1:#B9C1CE; --yr2:#6F7A8E; --yr3:var(--brand); --yr3-fg:var(--brand-fg);
  --shadow-sm:0 1px 2px rgba(19,35,63,.05); --shadow-float:0 8px 24px rgba(19,35,63,.10);
  --ease:cubic-bezier(.22,1,.36,1);
  --display:"Montserrat","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --home-ind:0px; --desk-bg:#E7EAF0; --bezel:#111010; --logo:"A";
}
:root[data-company="place"]{ --brand:#090B38; --brand-fg:#ffffff; --yr3:#090B38; --yr3-fg:#ffffff; --navy:#090B38; --logo:"P"; }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;transition:background-color .14s var(--ease),color .14s var(--ease),border-color .14s var(--ease),transform .14s var(--ease)}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--azure);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:100%;min-width:0;min-height:40px;line-height:20px}
textarea{resize:vertical;min-height:64px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:500}
svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
svg.ic.s{width:14px;height:14px;vertical-align:-2px}
svg.ic.l{width:20px;height:20px}
a{color:var(--azure)}

/* phone shell */
.phone{height:100%}
.screen{position:relative;height:100%;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.statusbar,.island,.homebar,.desk-cap{display:none}
@media (min-width:760px) and (min-height:720px){
  body{background:var(--desk-bg);display:grid;place-items:center;overflow:auto}
  body::before{display:none}
  .phone{width:393px;height:852px;max-height:calc(100vh - 40px);border-radius:56px;background:var(--bezel);padding:12px;box-shadow:0 24px 64px rgba(0,0,0,.35),0 0 0 2px #2a2826;position:relative;flex:none}
  .phone::before,.phone::after{content:"";position:absolute;width:3px;background:#2a2826;border-radius:2px;right:-5px;top:200px;height:100px}
  .phone::after{right:auto;left:-5px;top:170px;height:60px;box-shadow:0 80px 0 #2a2826,0 160px 0 #2a2826}
  .screen{border-radius:44px;transform:translateZ(0);--home-ind:24px}
  .statusbar{display:flex;align-items:center;justify-content:space-between;height:52px;padding:16px 32px 0 36px;font-size:15px;font-weight:500;flex:none;background:var(--surface);font-variant-numeric:tabular-nums}
  .statusbar .ic{display:flex;align-items:center;gap:6px}
  .statusbar svg{height:12px;width:auto;fill:currentColor}
  .island{display:block;position:absolute;top:12px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:18px;background:#000;z-index:50}
  .homebar{display:block;position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:136px;height:4px;border-radius:2px;background:var(--fg);opacity:.85;z-index:50}
  .desk-cap{display:block;position:fixed;left:0;right:0;bottom:16px;text-align:center;font-size:12px;line-height:16px;color:var(--muted)}
  .top{top:0}
  .nav{padding-bottom:calc(8px + var(--home-ind))}
  .toast{bottom:calc(96px + var(--home-ind))}
  .sheet .in{padding-bottom:calc(16px + var(--home-ind))}
}

/* app shell */
.app{flex:1;min-height:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--bg);position:relative;width:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;min-height:56px}
.top h1{font-size:17px;line-height:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--fg2)}
.top .back:hover,.lang:hover,.iconbtn:hover{background:var(--surface2)}
.lang{font-size:12px;line-height:16px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;color:var(--fg2);display:inline-flex;align-items:center;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--fg2);position:relative;border:1px solid var(--line);background:var(--surface)}
.iconbtn .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;font-weight:500;text-align:center}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--brand-fg);display:grid;place-items:center;font-weight:600;font-size:16px;flex:none;user-select:none;-webkit-user-select:none;touch-action:none}
.logo::after{content:var(--logo)}
.logo.lg{width:56px;height:56px;border-radius:16px;font-size:26px}
.body{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 112px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.body>*{flex:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:end}
.nav .tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;font-size:11px;line-height:12px;color:var(--muted);border-radius:8px}
.nav .tab svg{width:28px;height:28px;padding:4px;border-radius:8px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav .tab.on{color:var(--fg);font-weight:500}
.nav .tab.on svg{stroke:var(--brand-fg);background:var(--brand)}
:root[data-company="place"] .nav .tab.on svg{stroke:#fff}
.mic{position:relative;width:60px;height:60px;border-radius:50%;background:var(--mic);color:var(--mic-fg);display:grid;place-items:center;margin:-28px auto 0;border:4px solid var(--surface);box-shadow:var(--shadow-float);touch-action:none;user-select:none;-webkit-user-select:none}
.mic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round}
.mic.live::after,.speak.live::after,.tmic.live::after{content:"";position:absolute;inset:-6px;border:2px solid var(--mic);border-radius:inherit;animation:ring 1.2s var(--ease) infinite;pointer-events:none}
@keyframes ring{0%{opacity:.9;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.mic.live::after,.speak.live::after,.tmic.live::after{animation:none;opacity:.6}}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow-sm)}
.card h2{font-size:12px;line-height:16px;color:var(--muted);margin-bottom:8px;font-weight:500}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row>*{min-width:0}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12px;line-height:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ok{color:var(--green)}
.num{font-size:24px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;background:var(--surface2);color:var(--fg);font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface3)}
.btn.primary{background:var(--fg);color:#fff}
.btn.primary:hover{background:#2A3A5C}
.btn.honey{background:var(--brand);color:var(--brand-fg)}
.btn.honey:hover{background:#F2A21F}
:root[data-company="place"] .btn.honey:hover{background:#1A1D52}
.btn.accent{background:var(--accent);color:var(--accent-fg)}
.btn.danger{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:6px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:var(--surface2);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;height:32px;padding:0 8px;border-radius:6px;font-size:13px;color:var(--fg2)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm);font-weight:500}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--fg2);display:inline-flex;align-items:center;gap:6px}
.chips button.on{background:var(--brand);color:var(--brand-fg);border-color:var(--brand);font-weight:500}
.check{display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.check input{width:18px;height:18px;margin:0;min-height:0;accent-color:var(--fg)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;line-height:16px;color:var(--muted)}
.field.ai label::after{content:" · AI";color:var(--muted)}
.field.unsure input{border-color:var(--warm)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kv{display:grid;grid-template-columns:112px 1fr;gap:8px 12px;font-size:13px;line-height:20px}
.kv b{color:var(--muted);font-weight:400}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12px;line-height:16px;font-weight:500}
.switch i{width:36px;height:22px;border-radius:11px;background:var(--surface3);position:relative;display:block;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .2s}
.switch.on i{background:var(--green)}
.switch.on i::after{left:17px}
.live{display:inline-flex;align-items:center;gap:6px}
.live .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(34,160,107,.5);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,160,107,.5)}70%{box-shadow:0 0 0 8px rgba(34,160,107,0)}100%{box-shadow:0 0 0 0 rgba(34,160,107,0)}}
@media (prefers-reduced-motion:reduce){.live .pulse{animation:none}}

/* status dots (fixed for every company) + number plate */
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--steel)}
.dot.green{background:var(--green)} .dot.orange{background:var(--orange)} .dot.sky{background:var(--sky)} .dot.steel{background:var(--steel)}
.dot.pending{background:transparent;border:2px solid var(--steel);width:10px;height:10px}
.dot.red{background:var(--red)} .dot.blue{background:var(--azure)} .dot.amber{background:var(--warm)}
.dot.p{background:var(--brand);color:var(--brand-fg);width:14px;height:14px;font-size:9px;font-weight:500;display:inline-grid;place-items:center}
.dot.p::after{content:var(--logo)}
.dot.star{background:none;color:var(--gold);width:14px;height:14px}
.dot.pin{background:none;color:var(--navy);width:14px;height:14px}
.dot.ban{background:none;color:var(--red);width:14px;height:14px}
.plate{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 8px;border-radius:6px;background:var(--surface2);font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:500;color:var(--fg);flex:none}
.plate.lg{height:48px;padding:0 14px 0 12px;font-size:28px;gap:10px;border-radius:8px}
.plate.lg .dot{width:12px;height:12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:6px;font-size:12px;line-height:16px;background:var(--surface2);color:var(--fg2);white-space:nowrap;font-weight:500}
.chip.green{background:#DDF3E8;color:#146B47} .chip.red{background:#FBE1E5;color:#9E1B2C} .chip.blue{background:#DDEEFD;color:#135A9E} .chip.amber{background:#FFF0CC;color:#7A4D00}
.chip.hot{background:#FFE1D3;color:#B33A0E} .chip.warm{background:#FFF0CC;color:#7A4D00} .chip.cold{background:#DDEEFD;color:#135A9E}
.chip.pink{background:var(--pink);color:#8A2A3D} .chip.steel{background:var(--surface3);color:var(--fg2)} .chip.flag{background:#FFF0CC;color:#13233F;font-weight:500}
.chip.ban{background:#FBE1E5;color:#9E1B2C;font-weight:500} .chip.src{font-family:var(--mono);color:var(--muted)}
.chip.sel{box-shadow:inset 0 0 0 2px var(--fg)}
.role{font-size:12px;line-height:16px;padding:0 6px;border-radius:4px;background:var(--surface2);color:var(--muted)}
.yrs{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;background:var(--yr0);color:var(--fg2)}
.yrs.y1{background:var(--yr1);color:var(--fg)} .yrs.y2{background:var(--yr2);color:#fff} .yrs.y3{background:var(--yr3);color:var(--yr3-fg)}
.banner{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:var(--red);color:#fff;font-weight:500;font-size:13px;letter-spacing:.02em}
.masked{font-family:var(--mono);letter-spacing:.02em}

/* lists */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-top:1px solid var(--line);text-align:left;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--surface2)}
.item .t{font-weight:500}
.item .s{font-size:12px;line-height:16px;color:var(--muted)}
.item .arrow{color:var(--muted);display:grid;place-items:center;width:16px}
.note{padding:8px 12px;border-left:2px solid var(--surface3);background:var(--surface2);border-radius:0 8px 8px 0;font-size:13px;line-height:20px}
.note .m{font-size:12px;line-height:16px;color:var(--muted);font-family:var(--mono)}
.tl{display:flex;flex-direction:column}
.tl .e{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:20px}
.tl .e:first-child{border-top:0;padding-top:0}
.tl .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;line-height:16px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--surface3);color:var(--fg);display:grid;place-items:center;font-weight:500;flex:none;font-size:14px}
.avatar.lg{width:64px;height:64px;font-size:22px}
mark{background:#FFF0CC;color:inherit;border-radius:2px}
.photo{height:120px;border-radius:10px;background:#DCE6F2;overflow:hidden;position:relative}
.photo svg{width:100%;height:100%;display:block}

/* home */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow-sm)}
.tile .l{font-size:12px;line-height:16px;color:var(--muted);font-weight:500}
.tile .s{font-size:12px;line-height:16px;color:var(--fg2)}
.tile:hover{border-color:var(--steel)}
.todo{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.todo:first-child{border-top:0}
.todo .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--steel);flex:none;margin-top:2px;display:grid;place-items:center;color:#fff}
.todo.done .box{background:var(--green);border-color:var(--green)}
.todo.done .t{text-decoration:line-through;color:var(--muted)}
.todo .t{font-weight:500}
.todo .s{font-size:12px;line-height:16px;color:var(--muted)}
.todo .when{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.todo.over .when{color:var(--red);font-weight:500}
.grp{font-size:12px;line-height:16px;color:var(--muted);font-weight:500;margin:4px 0 0}

/* map */
.map{flex:none;height:208px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);position:relative;z-index:0}
.map.tall{height:296px}
.leaflet-container{font-family:var(--display);background:var(--surface2)}
.leaflet-control-attribution{font-size:10px!important;background:rgba(255,255,255,.8)!important;color:#5B6475!important}
.leaflet-control-attribution a{color:#5B6475!important}
.leaflet-tooltip.lbl{padding:0 6px;height:20px;line-height:20px;font-size:12px;font-weight:500;font-family:var(--mono);border-radius:4px;background:rgba(255,255,255,.92);color:#13233F;border:0;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.leaflet-tooltip.lbl::before{display:none}
.stlbl{font-size:11px;line-height:16px;color:#5B6475;text-align:center;white-space:nowrap;text-shadow:0 0 3px #fff}
.pmark{width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--brand-fg);font-weight:500;font-size:12px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pmark::after{content:var(--logo)}
.pmark.other{background:var(--steel);color:#fff}
.pmark.other::after{content:""}
.mk{display:grid;place-items:center;width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.mk svg{width:20px;height:20px;stroke:#fff;stroke-width:1.5;stroke-linejoin:round}
.me{width:18px;height:18px;border-radius:50%;background:var(--azure);border:3px solid #fff;box-shadow:0 0 0 2px rgba(43,149,245,.35),0 1px 3px rgba(0,0,0,.3)}
.mapbar{position:absolute;top:8px;right:8px;z-index:500;display:flex;gap:4px}
.mapbar button{height:28px;padding:0 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--fg2);box-shadow:var(--shadow-sm)}
.mapbar button.on{background:var(--fg);color:#fff;border-color:var(--fg)}

/* DK mode */
.at{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm)}
.at.gps{background:var(--brand);color:var(--brand-fg);border-color:transparent}
.at.gps .muted,.at.gps .eyebrow{color:inherit;opacity:.85}
.at.gps .plate,.at.gps .fact{background:rgba(255,255,255,.55);color:#13233F}
:root[data-company="place"] .at.gps .plate,:root[data-company="place"] .at.gps .fact{background:rgba(255,255,255,.14);color:#fff}
:root[data-company="place"] .at.gps .fact .l{color:rgba(255,255,255,.75)}
.at .eyebrow{font-size:12px;line-height:16px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;min-height:32px;font-weight:500}
.at .eyebrow span{display:inline-flex;align-items:center;gap:6px}
.at .addr{display:flex;align-items:center;gap:12px}
.at .addr .st{font-size:15px;line-height:20px;font-weight:500}
.at .status{display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;flex-wrap:wrap}
.at .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--surface2);border-radius:8px;padding:8px 12px;min-width:0}
.fact .l{font-size:12px;line-height:16px;color:var(--muted)}
.fact .v{font-size:13px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;font-weight:500}
.speak{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:12px;background:var(--mic);color:var(--mic-fg);font-weight:500;font-size:16px;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:var(--shadow-float)}
.speak svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round}
.onetap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.onetap button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:64px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--fg)}
.onetap button svg{width:20px;height:20px}
.onetap button:hover{border-color:var(--steel);background:var(--surface2)}
.onetap button.change{background:var(--surface2)}
.rows{display:flex;flex-direction:column;gap:4px}
.hrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;min-height:56px;padding:8px 12px 8px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.hrow.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.hrow.skip{opacity:.5}
.hrow .who{font-weight:500;font-size:13px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.hrow .sub{font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .right{font-family:var(--mono);font-size:12px;line-height:16px;color:var(--muted);text-align:right;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.sugg{display:flex;flex-direction:column;gap:4px}
.sugg button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left}
.sugg .s{font-size:12px;color:var(--muted)}

/* tags */
.taggrp{display:flex;flex-direction:column;gap:6px}
.taggrp .g{font-size:11px;line-height:14px;color:var(--muted);font-weight:500}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tagrow .chip{height:28px;border-radius:8px;cursor:pointer}

/* sheets, toast, search */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(19,35,63,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{width:100%;max-width:520px;background:var(--surface);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;animation:rise .3s var(--ease)}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet .in{animation:none}}
.sheet h3{font-size:15px;line-height:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wave{display:flex;gap:4px;align-items:center;justify-content:center;height:48px}
.wave i{width:4px;border-radius:2px;background:var(--mic);height:12px;animation:w .8s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}.wave i:nth-child(6){animation-delay:.5s}
@keyframes w{0%,100%{height:8px}50%{height:40px}}
@media (prefers-reduced-motion:reduce){.wave i{animation:none;height:24px}}
.transcript{padding:8px 12px;background:var(--surface2);border-radius:8px;min-height:40px;color:var(--fg2);line-height:20px}
.cmdres{display:flex;flex-direction:column;gap:8px}
.cmdres .card{padding:8px 12px} .cmdres .item{min-height:44px;padding:4px 0}
.intent{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--muted)}
.sample{font-size:12px;line-height:16px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.sample button{color:var(--azure);text-decoration:underline;text-underline-offset:2px}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 12px;height:44px;color:var(--muted)}
.searchbox input{border:0;background:transparent;padding:0;min-height:0;color:var(--fg)}
.toast[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:#fff;height:36px;padding:0 16px;display:flex;align-items:center;border-radius:8px;font-size:13px;z-index:30;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wm{position:fixed;inset:-40%;pointer-events:none;z-index:1;display:flex;flex-wrap:wrap;gap:56px 72px;align-content:space-around;justify-content:space-around;font-size:13px;font-weight:500;color:var(--fg);opacity:.07;transform:rotate(-22deg);white-space:nowrap;overflow:hidden}
.drawbar{position:absolute;left:8px;right:8px;bottom:8px;z-index:500;display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;box-shadow:var(--shadow-sm)}
.drawbar .grow{flex:1}
.cmp{display:grid;grid-template-columns:72px 1fr 1fr;gap:4px 8px;font-size:13px;align-items:center}
.cmp .h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cmp label{display:flex;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;min-height:36px}
.cmp label.on{border-color:var(--brand);background:var(--brand-soft,rgba(255,176,46,.12))}
.cmp label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schema{font-family:var(--mono);font-size:12px;line-height:20px;white-space:pre;overflow-x:auto;padding:12px;background:var(--surface2);border-radius:8px}
.preview{padding:10px 12px;border-radius:12px 12px 12px 2px;background:#DDEEFD;color:#13233F;font-size:13px;line-height:19px;white-space:pre-wrap}
.preview .mf{background:var(--purple);border-radius:3px;padding:0 3px}
.bigno{font-family:var(--mono);font-size:28px;line-height:36px;font-weight:500;text-align:center;letter-spacing:.04em}

/* translation easter egg */
.tr{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column}
.tr .half{flex:1;display:flex;flex-direction:column;gap:10px;padding:20px;min-height:0}
.tr .half.flip{transform:rotate(180deg);background:var(--surface);border-bottom:1px solid var(--line)}
.tr .who{font-size:12px;font-weight:500;color:var(--muted)}
.tr .said{flex:1;font-size:18px;line-height:26px;overflow:auto}
.tr .heard{font-size:14px;color:var(--fg2);line-height:20px}
.tmic{height:56px;border-radius:12px;background:var(--mic);color:#fff;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.tmic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.tr .bar{position:absolute;top:50%;left:0;right:0;height:1px;background:var(--line);transform:translateY(-50%)}
.tr .close{position:absolute;top:50%;right:12px;transform:translateY(-50%);z-index:2}
.tr .lsel{display:flex;gap:4px}
.tr .lsel button{height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line);font-size:12px;background:var(--surface)}
.tr .lsel button.on{background:var(--fg);color:#fff;border-color:var(--fg)}

/* login + me */
.login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:32px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.login .brand{display:flex;align-items:center;gap:12px;font-size:26px;line-height:32px;font-weight:500;letter-spacing:-.01em}
.login .brand small{display:block;font-size:13px;line-height:20px;font-weight:400;color:var(--muted);letter-spacing:0}
.login h2{font-size:17px;line-height:24px}
.login p{margin:4px 0 0;color:var(--fg2)}
.msbtn{display:flex;align-items:center;justify-content:center;gap:12px;height:48px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:500;font-size:15px}
.msbtn .mslogo{display:grid;grid-template-columns:1fr 1fr;gap:1px;width:16px;height:16px}
.msbtn .mslogo i{display:block}
.acct{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;width:100%}
.mfa{font-family:var(--mono);font-size:32px;line-height:40px;font-weight:500;letter-spacing:.1em;text-align:center;padding:16px;background:var(--surface2);border-radius:8px}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatch{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12px;line-height:16px;color:var(--fg2);text-align:left}
.swatch.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.swatch i{display:block;height:28px;border-radius:4px}
.palettes{position:fixed;right:16px;bottom:16px;z-index:40;display:none;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-float)}
.palettes button{height:32px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--fg2);display:inline-flex;align-items:center;gap:6px}
.palettes button i{width:12px;height:12px;border-radius:3px;display:block}
.palettes button.on{background:var(--fg);color:#fff}
@media (min-width:760px) and (min-height:720px){.palettes{display:flex}}

/* desktop guide */
.stage{height:100%}
.guide{display:none}
@media (min-width:1080px) and (min-height:720px){
  .stage{display:flex;align-items:center;gap:40px;height:auto}
  .guide{display:flex;flex-direction:column;gap:12px;width:360px;max-height:calc(100vh - 40px);overflow-y:auto;color:var(--fg);padding:4px 0}
  .guide .kicker{font-size:12px;line-height:16px;color:var(--muted)}
  .guide h2{font-size:22px;line-height:28px;font-weight:500;margin:4px 0 8px}
  .guide p{margin:0;font-size:14px;line-height:22px;color:var(--fg2)}
  .guide .gcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
  .guide .gcard h3{font-size:12px;line-height:16px;color:var(--muted);font-weight:500}
  .guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:20px;color:var(--fg2)}
  .guide ol b{font-weight:500;color:var(--fg)}
  .guide .model{font-family:var(--mono);font-size:12px;line-height:20px;white-space:pre-wrap;background:var(--surface2);border-radius:8px;padding:12px;color:var(--fg2)}
  .guide .crumb{display:flex;gap:4px;flex-wrap:wrap}
  .guide .crumb span{font-size:12px;line-height:16px;padding:4px 8px;border-radius:4px;background:var(--surface2);color:var(--muted);font-family:var(--mono)}
  .guide .crumb span.on{background:var(--fg);color:#fff}
  .guide .gcard.fb{border-left:3px solid var(--accent, #FFB02E)}
  .guide .fbsec{display:grid;grid-template-columns:34px 1fr;gap:6px;font-size:12px;line-height:18px;color:var(--fg2)}
  .guide .fbsec+.fbsec{margin-top:6px}
  .guide .fbsec b{font-family:var(--mono);font-weight:600;color:var(--fg)}
  .guide .fbsec i{display:block;font-style:normal;color:var(--muted);margin-bottom:2px}
  .guide .fbsec div{position:relative;padding-left:10px}
  .guide .fbsec div::before{content:"·";position:absolute;left:0}
  .guide .fbst{font-style:normal;font-size:10px;line-height:14px;padding:0 5px;border-radius:3px;margin-left:6px;vertical-align:1px}
  .guide .fbst.sim{background:var(--surface2);color:var(--muted)}
  .guide .fbst.dev{background:#FFF1E6;color:#B4480F}
  .guide .fbleg{font-size:11px;line-height:16px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
}
</style>

function matchContacts({mobile,email}){

}
function rexCheck(r, pick){

    :m.status==="multiple"?`<span class="chip amber">${ic("zap","s")}${t("rx_multiple")}</span>`:`<span class="chip">${t("rx_none")}</span>`;
  const picker=m.status==="multiple"?`<div class="stack" style="margin-top:6px">${m.list.map(x=>`<label class="check"><input type="radio" name="rx_pick" value="${x.c.id}" ${chosen===x.c.id?"checked":""}> <b>${cname(x.c)}</b> <span class="small muted">· ${x.c.roles.join(", ")||"—"} · ${t("rx_by")} ${x.by} · ${x.c.owner}</span></label>`).join("")}<label class="check"><input type="radio" name="rx_pick" value="new" ${chosen==="new"?"checked":""}> ${t("rx_new")}</label>${m.list.length===2&&m.list[0].c.owner===m.list[1].c.owner?`<button class="btn sm ghost" data-act="mergeopen" data-a="${m.list[0].c.id}" data-b="${m.list[1].c.id}">${ic("zap","s")} ${t("compare")}</button>`:""}</div>`:"";

function mergeContacts(aId, bId, pick){

  b.roles.forEach(r=>{ if(!a.roles.includes(r)) a.roles.push(r); }); b.tags.forEach(x=>{ if(!a.tags.includes(x)) a.tags.push(x); }); b.rels.forEach(r=>{ if(!a.rels.some(x=>x.type===r.type&&x.name===r.name)) a.rels.push(r); });

  if(/might sell|may sell|thinking of selling|could sell|可能卖|想卖|考虑卖|sell next|apprais|估价/i.test(text)){ r.intent="Potential seller"; r.tags.push("Potential seller"); r.ps=true; r.type="seller"; }

  const tm = text.match(/next (spring|summer|autumn|winter|year|month)|in (\d+) months?|early (\d{4})|(明年|春天|三月|下个月|年底)/i); if(tm) r.timing = tm[0];
  if(/march|三月/i.test(text)) r.followup = "2027-03-01"; else if(/next year|明年/i.test(text)) r.followup = "2027-01-15"; else if(/next month|下个月/i.test(text)) r.followup = addDays(30); else if(r.ps) r.followup = addDays(14);
  if(/building and pest|building & pest|b&p|验房/i.test(text)) r.req.bp=true;
  if(/form 2|disclosure/i.test(text)) r.req.form2=true;
  if(/private (inspection|viewing)/i.test(text)) r.req.private=true;
  if(/broker|finance|贷款/i.test(text)) r.req.broker=true;
  if(/downsiz|kids (have )?moved out|孩子.*搬/i.test(text)){ r.reason="Downsizing"; r.tags.push("Downsizing"); }
  if(/upsiz|bigger|growing family/i.test(text)){ r.reason="Upsizing"; r.tags.push("Upsizing"); }
  if(/school/i.test(text)){ r.reason="Moving for school"; r.tags.push("Moving for school"); }
  if(/relocat|interstate|overseas/i.test(text)){ r.reason="Relocating"; r.tags.push("Relocating"); }
  if(/investor|投资/i.test(text)){ r.tags.push("Investor"); if(!r.reason) r.reason="Investor"; }
  if(/market update/i.test(text)) r.tags.push("Market update");
  if(/don'?t (contact|call|knock)|stop knocking|别再上门|别来敲门|别联系/i.test(text)) r.tags.push("Do not contact");
  if(/friendly|nice chat|lovely/i.test(text)) r.tags.push("Friendly");
  if(r.mobile) r.tags.push("Phone provided"); if(r.email) r.tags.push("Email provided");
  const a = text.match(/(\d+[a-z]?\/?\d*\s+[A-Z][a-z]+\s+(?:St|Street|Rd|Road|Ave|Avenue|Ct|Dr)\b[^,.]*)/); if(a) r.address=a[1];
  else { const h = text.match(/(?:own|owns|house|home|房子?)\s+(?:in|at|在)\s+([A-Z][a-z]+)/); if(h) r.address=h[1]; }
  const src = text.match(/from (domain|rea|realestate(?:\.com\.au)?|eplace|referral|phone|walk[- ]?in)/i); if(src) r.source=src[1];
  const nd = text.match(/(wants?|looking for|needs?)\s+(.+?)(?:\.|$)/i); if(nd) r.need=nd[2];
  if(!r.mobile) r.unsure.push("mobile");
  return r;
}

function searchBuyers(q){
  const ql=q.toLowerCase(); const beds=(ql.match(/(\d)\s*bed/)||[])[1]; const subs=["sunnybank","runcorn","eight mile plains","calamvale"].filter(s=>ql.includes(s));
  const cap=(ql.match(/(?:up to|under|max)\s*\$?([\d.]+)\s*(m|million|k)?/)||[]); let capN=cap[1]?parseFloat(cap[1])*((cap[2]||"").startsWith("m")?1e6:cap[2]==="k"?1e3:1):0; if(capN&&capN<10) capN*=1e6;
  return S.contacts.filter(c=>c.buyerProfile||c.roles.includes("buyer")).filter(c=>{ const bp=c.buyerProfile||{};
    if(beds && bp.beds && +bp.beds>+beds) return false;
    if(subs.length && bp.suburbs && !subs.some(s=>bp.suburbs.toLowerCase().includes(s))) return false;
    if(/investor/.test(ql) && !c.tags.includes("Investor")) return false;
    if(/pre-?approved/.test(ql) && bp.finance!=="Pre-approved") return false;
    if(/hot/.test(ql) && !c.tags.includes("Hot")) return false;
    return true; });
}

function hl(text,q){ if(!q) return esc(text); const i=String(text).toLowerCase().indexOf(q.toLowerCase()); if(i<0) return esc(text); return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length)); }
function doSearch(q){
  const ql=q.trim().toLowerCase(); if(!ql) return null; const qd=ql.replace(/\D/g,"");
  const contacts=S.contacts.filter(c=> cname(c).toLowerCase().includes(ql) || (qd.length>=3 && normMobile(c.mobile).includes(qd)) || (c.email||"").toLowerCase().includes(ql) || c.tags.some(x=>x.toLowerCase().includes(ql)) || c.notes.some(n=>n.t.toLowerCase().includes(ql)));
  const props=S.properties.filter(p=> propAddr(p).toLowerCase().includes(ql) || (p.pfOwner||"").toLowerCase().includes(ql));
  const listings=S.listings.filter(l=> propAddr(byId(S.properties,l.propertyId)).toLowerCase().includes(ql) || l.agent.toLowerCase().includes(ql));
  const enq=S.enquiries.filter(e=> e.raw.toLowerCase().includes(ql) || (qd.length>=3 && normMobile(e.parsed.mobile).includes(qd)));
  return {contacts,props,listings,enq,total:contacts.length+props.length+listings.length+enq.length};
}

// ===== Maps (Leaflet + OSM / Esri imagery). Lot polygons are schematic here; Draft 2 needs real parcel boundaries (question for Kevin). =====
let maps=[];
function lotPoly(ll){ const dy=0.00011, dx=0.00007; return [[ll[0]-dy,ll[1]-dx],[ll[0]-dy,ll[1]+dx],[ll[0]+dy,ll[1]+dx],[ll[0]+dy,ll[1]-dx]]; }
const COLOR={green:"#22A06B",orange:"#FF8A3D",sky:"#5BB8F5",pending:"#8A94A6",steel:"#8A94A6",red:"#D7263D"};
function drawSchematic(m){
  const st=streets();
  Object.keys(st).forEach(k=>{ const ps=st[k].filter(p=>p.ll).sort((a,b)=>parseInt(a.no)-parseInt(b.no)); if(!ps.length) return;
    const lat=ps[0].ll[0]+0.00016; const lngs=ps.map(p=>p.ll[1]); const a=Math.min(...lngs)-0.0003, b=Math.max(...lngs)+0.0003;
    L.polyline([[lat,a],[lat,b]],{color:"#9aa1b4",weight:14,opacity:.5,lineCap:"round"}).addTo(m);
    L.polyline([[lat,a],[lat,b]],{color:"#fff",weight:1,dashArray:"6 8",opacity:.9}).addTo(m);
    L.marker([lat,(a+b)/2],{icon:L.divIcon({className:"",html:`<div class="stlbl">${k}</div>`,iconSize:[160,16],iconAnchor:[80,8]}),interactive:false}).addTo(m);
  });
  m.attributionControl.addAttribution("offline schematic");
}
function mountMaps(){
  maps.forEach(m=>{ try{ m.remove(); }catch(e){} }); maps=[];
  if(!window.L) return;
  document.querySelectorAll("[data-map]").forEach(el=>{ try{ mountOne(el); }catch(err){ console.warn("map failed", err); el.innerHTML=`<div class="muted small" style="padding:12px">map unavailable</div>`; } });
}
function svgMarker(path,color){ return L.divIcon({className:"",html:`<div class="mk"><svg viewBox="0 0 24 24" style="fill:${color}">${path}</svg></div>`,iconSize:[22,22],iconAnchor:[11,11]}); }
function propMarker(p,m,isAt){
  const col=COLOR[propColor(p)]; const pending=propColor(p)==="pending";
  L.polygon(lotPoly(p.ll),{color:col,weight:1,fillColor:col,fillOpacity:pending?.04:.12,dashArray:pending?"3 3":null}).addTo(m);
  let mk;
  if(p.flags.dnc) mk=L.marker(p.ll,{icon:svgMarker(PATHS.ban,"#D7263D")});
  else if(p.pinned) mk=L.marker(p.ll,{icon:svgMarker(PATHS.pin,"#1C3F8F")});
  else if(p.appraisal) mk=L.marker(p.ll,{icon:svgMarker(PATHS.star,"#E0A100")});
  else if(S.listings.some(l=>l.propertyId===p.id&&l.status==="listed")) mk=L.marker(p.ll,{icon:L.divIcon({className:"",html:'<div class="pmark"></div>',iconSize:[22,22],iconAnchor:[11,11]})});
  else if(p.otherListing) mk=L.marker(p.ll,{icon:L.divIcon({className:"",html:'<div class="pmark other"></div>',iconSize:[22,22],iconAnchor:[11,11]})});
  else mk=L.circleMarker(p.ll,{radius:isAt?10:7,color:isAt?"#13233F":"#fff",weight:isAt?3:2,fillColor:pending?"#fff":col,fillOpacity:1,dashArray:pending?"2 2":null});
  if(pending) L.circleMarker(p.ll,{radius:isAt?10:7,color:"#8A94A6",weight:2,fillColor:"#fff",fillOpacity:1}).addTo(m);
  mk.addTo(m); mk.bindTooltip(p.no,{permanent:true,direction:"top",offset:[0,-10],className:"lbl"});
  return mk;
}
function mountOne(el){
    const kind=el.dataset.map;
    const m=L.map(el,{zoomControl:false,attributionControl:true,tap:false}); maps.push(m);
    const tiles=(view.sat?L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"© Esri"}):L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"})).addTo(m);
    m.attributionControl.setPrefix(false);
    let tileErr=0, schematic=false;
    tiles.on("tileerror",()=>{ if(++tileErr>=2 && !schematic){ schematic=true; m.removeLayer(tiles); drawSchematic(m); } });
    tiles.on("load",()=>{ tileErr=0; });
    const pts=[];
    if(kind==="street"){
      S.zones.forEach(z=>{ const pg=L.polygon(z.pts,{color:getComputedStyle(document.documentElement).getPropertyValue("--brand").trim()||"#FFB02E",weight:2,dashArray:"6 4",fillOpacity:view.zone===z.id?.08:.03}).addTo(m); pg.bindTooltip(z.name,{permanent:true,direction:"center",className:"lbl"}); pg.on("click",()=>{ if(view.drawing) return; view.zone=view.zone===z.id?null:z.id; render(); }); });
      if(view.drawing){ const dp=view.drawPts||[]; dp.forEach(pt=>{ pts.push(pt); L.circleMarker(pt,{radius:5,color:"#13233F",weight:2,fillColor:"#fff",fillOpacity:1}).addTo(m); }); if(dp.length>1) L.polyline(dp.concat(dp.length>2?[dp[0]]:[]),{color:"#13233F",weight:2,dashArray:"4 4"}).addTo(m);
        m.on("click",e=>{ view.drawPts=(view.drawPts||[]).concat([[e.latlng.lat,e.latlng.lng]]); render(); }); }
    }
    if(kind==="street"||kind==="pick"){
      const zone=kind==="street"&&view.zone&&byId(S.zones,view.zone);
      const props=zone?zoneProps(zone):(streets()[view.street]||[]);
      props.forEach(p=>{ if(!p.ll) return; pts.push(p.ll); const isAt=p.id===view.at;
        const mk=propMarker(p,m,isAt);
        mk.on("click",()=>{ if(view.drawing) return; if(kind==="pick"){ view.gps=false; view.at=p.id; sheet=null; render(); return; } view.gps=false; view.at=p.id; render(); });
      });
      if(view.gps!==false && kind==="street"){ const at=byId(S.properties,view.gpsAt||"p6"); if(at&&at.ll){ L.marker([at.ll[0]+0.00004,at.ll[1]-0.00002],{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false,zIndexOffset:1000}).addTo(m); } }
    }
    if(kind==="ofi"){
      S.listings.filter(l=>l.ofi.some(o=>o.d===TODAY)).forEach(l=>{ const p=byId(S.properties,l.propertyId); if(!p.ll) return; pts.push(p.ll); const o=l.ofi.find(o=>o.d===TODAY);
        const mk=L.marker(p.ll,{icon:L.divIcon({className:"",html:'<div class="pmark"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(m);
        mk.bindTooltip(`${p.no} ${p.street} · ${o.time}`,{permanent:true,direction:"top",offset:[0,-12],className:"lbl"});
        mk.on("click",()=>go({name:"ofi",id:l.id}));
      });
      S.properties.filter(p=>p.ll&&!S.listings.some(l=>l.propertyId===p.id&&l.status==="listed")).forEach(p=>L.circleMarker(p.ll,{radius:4,color:"#fff",weight:1,fillColor:COLOR[propColor(p)],fillOpacity:.9}).addTo(m));
    }
    if(kind==="one"){ const p=byId(S.properties,el.dataset.id); if(p&&p.ll){ pts.push(p.ll); propMarker(p,m,true); } }
    if(pts.length>1) m.fitBounds(pts,{padding:[26,26],maxZoom:19}); else if(pts.length) m.setView(pts[0],18); else m.setView([-27.579,153.062],15);
    setTimeout(()=>m.invalidateSize(),50);
}

  contact:{en:{title:"Contact",what:"One person, one record, one or more roles. Masked contact details, tags by group, Rex relationship types, 'Last updated by' separate from the owning agent.",steps:["Tags: Visit, Sell intent, Restrictions, Collected, Follow-up, Reason.","Relationships: Partner of, Co-owner with, Tenant of… (Rex custom types).","STOP reply → Opted out: SMS, note, blacklist, red banner."],model:"Contact ├─ owner ─► Property\n        └─ buyer ─► Buyer profile"},zh:{title:"联系人",what:"一个人一条记录，可有多个角色。号码隐藏、标签分组、Rex 关系类型，“Last updated by” 和负责人分开显示。",steps:["标签：拜访、卖房意向、限制、已收集、跟进、原因。","关系：Partner of、Co-owner with、Tenant of…（Rex 自定义类型）。","回复 STOP → Opted out: SMS、备注、黑名单、红色横幅。"],model:"Contact ├─ 业主 ─► Property\n        └─ 买家 ─► Buyer profile"}},

  enq:{en:{title:"Enquiry mode",what:"Two jobs: add an enquiry (phone, walk-in, portal, referral) and search enquiries by voice. Leads shared from the phone also land here.",steps:["<b>+ Add enquiry</b>: hold to speak or type; mobile first (Rex duplicate check), names, type, source, need, next step. Save to Rex creates or updates the contact, the buyer match profile and a note.","<b>Search</b>: 'Buyers looking for 4 bed in Runcorn up to 1.2 million' → list with Call on each and Text all.","<b>Leads</b>: portal / email / SMS / screenshot leads, read by AI, matched to Rex, with a suggested next step."],model:"Enquiry ─┬ seller ─► Property\n         └ buyer  ─► Buyer profile"},zh:{title:"Enquiry 模式",what:"两部分：添加询盘（电话、到店、房产网站、转介绍）和语音搜索询盘。从手机分享来的线索也进这里。",steps:["<b>+ Add enquiry</b>：按住说话或手动输入；先填手机号（Rex 查重）、姓名、类型、来源、需求、下一步。Save to Rex 创建或更新联系人、买家匹配档案和备注。","<b>Search</b>：“Buyers looking for 4 bed in Runcorn up to 1.2 million” → 列表，每人有 Call，还可 Text all。","<b>线索</b>：房产网站 / 邮件 / 短信 / 截图线索，AI 读取、匹配 Rex、建议下一步。"],model:"Enquiry ─┬ 卖家 ─► Property\n         └ 买家 ─► 买家档案"}},
  enquiry:{en:{title:"File a lead",what:"AI read it, matched Rex, shows history, drafts a note and suggests the next step. The agent confirms or changes.",steps:["Switch Seller / Buyer if AI guessed wrong.","Rex duplicate check (find-matching-contacts) by email and phone: unique → update that contact; several → the agent picks one or creates new; none → create.","Approve creates a Rex Lead (leads/create): contact + listing or property + source + note, assigned to an agent. Notes are only for other things.","Marketing consent is four separate channel flags, written as contact_by_email / sms / phone / letter.","Suggested next step becomes a to-do."],model:"lead ─► find-matching-contacts ─► contact ─► leads/create ─► next step"},zh:{title:"归档线索",what:"AI 读取、匹配 Rex、显示历史、起草备注并建议下一步。中介确认或修改。",steps:["AI 判断错了可切换卖家 / 买家。","Rex 查重（find-matching-contacts）按邮箱和电话：唯一 → 更新该联系人；多条 → 中介选一个或新建；无 → 新建。","Approve 创建 Rex Lead（leads/create）：联系人 + 房源/物业 + 来源 + 备注，并分配给经纪人。Note 只用于其他内容。","营销同意是四个独立渠道开关，写为 contact_by_email / sms / phone / letter。","建议的下一步生成待办。"],model:"线索 ─► 匹配 ─► 备注 ─► 下一步"}},

function fbCard(L){
  const cur=current();
  const items=[...(S.auth?(FB[cur.name]||FB[view.tab]||[]):FB.login), ...((sheet&&FB_SHEET[sheet.kind])||[])];
  if(!items.length) return "";
  const order=["1","2","3","3a","3b","4","5","6","7","8","9","10","11","rex"];
  const groups={}; items.forEach(i=>{(groups[i.s]=groups[i.s]||[]).push(i);});
  const mark={ok:"",sim:`<em class="fbst sim">${L==="en"?"simulated":"模拟"}</em>`,dev:`<em class="fbst dev">${L==="en"?"deviates":"有意偏离"}</em>`};
  const body=order.filter(k=>groups[k]).map(k=>`<div class="fbsec"><b>${k==="rex"?"✉":"§"+k}</b><span><i>${(FB_SEC[k]||{})[L]||""}</i>${groups[k].map(i=>`<div>${i[L]}${mark[i.st]||""}</div>`).join("")}</span></div>`).join("");
  return `<div class="gcard fb"><h3>${L==="en"?"Feedback document":"反馈文档对应章节"} · <span class="muted">${FB_DOC[L]}</span></h3>${body}
    <div class="fbleg">${L==="en"?"Plain = in the prototype · simulated = behaviour shown, real system later · deviates = changed on purpose, doc to be updated":"无标记 = 原型已实现 · 模拟 = 行为已呈现，真实系统待接入 · 有意偏离 = 故意改动，文档需更新"}</div></div>`;
}
function renderGuide(){
  const g=document.getElementById("guide"); if(!g) return;
  const cur=current(); const L=lang; const d=(S.auth?(GUIDE[cur.name]||GUIDE[view.tab]||GUIDE.home):GUIDE.login)[L];
  const path=S.auth?[view.tab,...view.stack.map(x=>x.name)]:["login"];
  const sh = sheet && SHEET_GUIDE[sheet.kind] ? SHEET_GUIDE[sheet.kind][L] : null;
  g.innerHTML=`<div><div class="kicker">${L==="en"?"This screen":"当前页面"}</div><h2>${d.title}</h2><p>${d.what}</p></div>
    <div class="crumb">${path.map((k,i)=>`<span class="${i===path.length-1?"on":""}">${GUIDE[k]?GUIDE[k][L].title:k}</span>`).join("")}${sheet?`<span class="on">${sheet.kind}</span>`:""}</div>
    ${fbCard(L)}

    ${d.steps.length?`<div class="gcard"><h3>${L==="en"?"What you can do":"可以做的操作"}</h3><ol>${d.steps.map(x=>`<li>${x}</li>`).join("")}</ol></div>`:""}

function looksLikeSearch(text){ const q=text.trim(); if(!q) return true; if(/^(who|find|search|show|where|which|look ?up|owner of|buyers|谁|找|搜|查|看看)/i.test(q)) return true; const words=q.split(/\s+/).length; return words<=3 && !/\d{8,}/.test(q.replace(/\s/g,"")); }
function cmdResults(text){
  const q=text.trim().replace(/^(who owns|who is at|find|search|show|look ?up|owner of|谁住在|谁是|找|搜|查)\s*/i,""); const r=doSearch(q);
  if(!r) return `<div class="small muted">${t("search_hint")}</div>`;
  const lim=3; const item=(act,id,lead,main,sub)=>`<button class="item" style="border:0" data-act="${act}" data-id="${id}">${lead}<span class="grow" style="min-width:0"><span class="t">${main}</span><br><span class="s">${sub}</span></span><span class="arrow">›</span></button>`;
  let h=`<div class="intent">${looksLikeSearch(text)?ic("search","s")+t("looks_search"):ic("pencil","s")+t("looks_capture")} · ${r.total} ${t("results")}</div>`;
  if(r.contacts.length) h+=`<div class="card"><h2>${t("contacts")}</h2>${r.contacts.slice(0,lim).map(c=>item("contact",c.id,`<span class="avatar" style="width:28px;height:28px;font-size:11px">${c.first[0]||"?"}</span>`,hl(cname(c),q)+" "+c.roles.map(x=>`<span class="role">${x}</span>`).join(" "),`<span class="masked">${mask(c.mobile)}</span> · ${c.tags.join(", ")}`)).join("")}</div>`;
  if(r.props.length) h+=`<div class="card"><h2>${t("properties")}</h2>${r.props.slice(0,lim).map(p=>item("prop",p.id,`<span class="dot ${propColor(p)}"></span>`,hl(propAddr(p),q),ownersOf(p).map(cname).join(", ")||(p.pfOwner?"PF: "+hl(p.pfOwner,q):"—"))).join("")}</div>`;
  if(r.listings.length) h+=`<div class="card"><h2>${t("listings")}</h2>${r.listings.slice(0,lim).map(l=>{const p=byId(S.properties,l.propertyId); const today=l.ofi.some(o=>o.d===TODAY); return item(today?"ofi":"prop",today?l.id:p.id,`<span class="dot p"></span>`,hl(propAddr(p),q),l.price+" · "+l.agent);}).join("")}</div>`;
  if(r.enq.length) h+=`<div class="card"><h2>${t("enq")}</h2>${r.enq.slice(0,lim).map(e=>item("enquiry",e.id,`<span class="chip ${e.type==="seller"?"amber":"blue"}">${t(e.type)}</span>`,esc(e.parsed.first+" "+e.parsed.last),hl(e.raw.slice(0,60),q)+"…")).join("")}</div>`;
  if(!r.total) h+=`<div class="small muted">${t("no_results")}</div>`;
  if(r.total>lim) h+=`<button class="btn sm ghost" data-act="searchall">${t("see_all")} ${r.total} →</button>`;
  return h;
}

function fillTpl(s,c,p){ const m={"First name":c?c.first:"", "Street":p?p.street:"", "Suburb":p?p.suburb:"", "Years owned":p?yearsSince(p.lastSale):"", "My name":ME().split(" ")[0], "Company":COMPANY(), "Date":"Tue 11 Nov 4:00pm"}; return s.replace(/\{([^}]+)\}/g,(_,k)=>m[k]??k); }
function smsCount(s){ const uni=/[^\x00-\x7F]/.test(s); const per=uni?70:160, perMulti=uni?67:153; const n=s.length; return {n, parts:n<=per?1:Math.ceil(n/perMulti)}; }

// ---------- write-backs ("Rex connector") ----------
function upsertContact(r, agent=ME()){
  let m = findContact(r);
  if(r.pickId==="new") m=null; else if(r.pickId){ const pc=byId(S.contacts,r.pickId); if(pc) m={c:pc, by:"chosen"}; }
  else { const mm=matchContacts(r); if(mm.status==="multiple") m={c:mm.list[0].c, by:mm.list[0].by}; }
  let c;
  if(m){ c = m.c; if(r.first&&!c.first) c.first=r.first; if(r.email&&!c.email) c.email=r.email; if(r.mobile&&!c.mobile) c.mobile=r.mobile; }
  else { c = {id:uid("c"), first:r.first||"Unknown", last:r.last||"", mobile:r.mobile||"", email:r.email||"", roles:[], owner:agent, tags:[], reason:"", flags:{}, optedOut:false, consent:{email:1,sms:1,phone:1,letter:1}, rels:[], updated:{by:agent,d:TODAY}, notes:[], buyerProfile:null, history:[]}; S.contacts.unshift(c); }
  if(r.relation && !c.roles.includes(r.relation)) c.roles.push(r.relation);
  (r.tags||[]).forEach(x=>{ if(x==="Do not contact"){ c.flags.dnc=true; } if(!c.tags.includes(x)) c.tags.push(x); });
  setConsent(c, r.consent); if(r.consent) c.consentRec={d:TODAY, how:r.consentHow||t("how_app")}; if(c.flags.dnc) setConsent(c,{email:0,sms:0,phone:0,letter:0});
  if(r.reason) c.reason=r.reason;
  if(r.note) c.notes.unshift({d:TODAY, a:agent, t:r.note});
  touch(c);
  return {c, matched:!!m};
}
// Mirrors Rex leads/create: contact + listing or property + source + note + assignee
function createLead(c, {propertyId, listingId, source, note, assignee, type}){
  const l={id:uid("ld"), contactId:c.id, propertyId:propertyId||"", listingId:listingId||"", source:source||"", note:note||"", assignee:assignee||ME(), type:type||"buyer", d:TODAY, status:"open"};
  S.leads.unshift(l); noteOn(c, `Lead · ${l.source}${propertyId?" · "+shortAddr(byId(S.properties,propertyId)):""} → ${l.assignee}${note?" · "+note:""}`, "AxleoCollect"); return l;
}
function linkOwner(c, p){ if(!p.ownerIds.includes(c.id)) p.ownerIds.push(c.id); if(!c.roles.includes("owner")) c.roles.push("owner"); p.pending=false; }
function readConfirm(){
  const g = id => document.getElementById(id)?.value ?? "";
  return {first:g("cf_first"), last:g("cf_last"), mobile:g("cf_mobile"), email:g("cf_email"), relation:g("cf_rel"), followup:g("cf_fu"), reason:g("cf_reason"), link:g("cf_link"), tags:g("cf_tags").split(",").map(s=>s.trim()).filter(Boolean), note:g("cf_note"), pickId:readPick(), consent:readConsent("cs"), consentHow:t("how_door")};
}
function commitDK(r, propId){
  const p = byId(S.properties, propId);
  const {c, matched} = upsertContact(r);
  if(["owner","landlord"].includes(r.relation)) linkOwner(c,p);
  if(c.flags.dnc) p.flags.dnc=true;
  if(r.link){ const [nm,ty]=r.link.split("·").map(s=>s.trim()); if(nm) c.rels.push({type:ty||"Partner of", name:nm}); }
  if(r.followup) addTodo({d:r.followup, t:`Follow up ${cname(c)} · ${propAddr(p)}`, kind:r.tags.includes("Hot")?"hot":"call"});
  if(/market update/i.test(r.note)) addTodo({d:TODAY, t:`Send market update · ${cname(c)} · ${shortAddr(p)}`, kind:"call"});
  p.visits.push({d:TODAY, o:"spoke"});
  audit("DK", `${propAddr(p)} · ${cname(c)}`);
  persist(); toast(`${t("filed_ok")} · ${cname(c)}${matched?" ("+t("matched")+")":""}`);
  return c;
}
function commitOH(r, listingId){
  const l = byId(S.listings, listingId); const p = byId(S.properties, l.propertyId);
  const o = l.ofi.find(o=>o.d===TODAY);
  const {c} = upsertContact({...r, relation:"buyer", note: r.note});
  if(!c.history.some(h=>h.d===TODAY && h.t.includes(p.no))) c.history.unshift({d:TODAY, t:"OFI "+propAddr(p)});
  if(!o.attendees.some(a=>a.contactId===c.id)) o.attendees.push({contactId:c.id, d:TODAY, req:r.req||{}, ps:!!r.ps, note:r.note||""});
  const rq=r.req||{}; const pr=S.partners;
  if(rq.form2){ if(l.form2) noteOn(c,`Form 2 emailed ${TODAY}.`,"AxleoCollect"); else addTodo({d:TODAY,t:`Send Form 2 to ${cname(c)}`,who:l.agent,kind:"call"}); }
  if(rq.bp){ if(l.bpReport) noteOn(c,"Building & pest report emailed.","AxleoCollect"); else addTodo({d:TODAY,t:`Send B&P report to ${cname(c)}`,who:l.agent,kind:"call"}); }
  if(rq.private) addTodo({d:TODAY,t:`Book private inspection · ${cname(c)} · ${shortAddr(p)} (within 2 h)`,who:l.agent,kind:"appt"});
  if(rq.broker) S.referrals.unshift({id:uid("rf"), type:"broker", to:pr.broker[0], contactId:c.id, propertyId:p.id, d:TODAY, status:"sent"});
  if(rq.conv) S.referrals.unshift({id:uid("rf"), type:"conv", to:pr.conv[0], contactId:c.id, propertyId:p.id, d:TODAY, status:"sent"});
  if(rq.rental) S.referrals.unshift({id:uid("rf"), type:"rental", to:pr.rental[0], contactId:c.id, propertyId:p.id, d:TODAY, status:"sent"});
  if(rq.broker){ noteOn(c,`Mortgage broker referral sent to ${pr.broker[0]}, ${TODAY} · consent recorded`,"AxleoCollect"); addTodo({d:addDays(1),t:`Broker follow-up · ${cname(c)}`,who:pr.broker[0],kind:"call"}); }
  if(rq.conv) noteOn(c,`Conveyancer referral sent to ${pr.conv[0]}, ${TODAY} · consent recorded`,"AxleoCollect");
  if(rq.rental){ noteOn(c,`Rental appraisal request sent to ${pr.rental[0]}, ${TODAY}`,"AxleoCollect"); addTodo({d:addDays(2),t:`Rental appraisal · ${cname(c)}`,who:pr.rental[0],kind:"appt"}); }
  if(rq.guide) noteOn(c,"Buyer guide emailed.","AxleoCollect");
  if(rq.dbyd) addTodo({d:addDays(2),t:`Send Dial Before You Dig info · ${cname(c)}`,who:l.agent,kind:"call"});
  if(r.consent) c.consentRec={d:TODAY, how:t("how_ofi")};
  addTodo({d:TODAY,time:"15:00",t:`Call for feedback · ${cname(c)} · ${shortAddr(p)}`,who:l.agent,kind:"call"});
  if(r.ps){ if(!c.tags.includes("Potential seller")) c.tags.push("Potential seller"); addTodo({d:addDays(7),t:`Appraisal follow-up ${cname(c)}`,who:l.agent,kind:"hot"});
    if(r.address){ const hp = S.properties.find(x=>r.address.toLowerCase().includes((x.no+" "+x.street).toLowerCase())); if(hp) linkOwner(c,hp); } }
  audit("OFI", `${propAddr(p)} · ${cname(c)}`);
  persist(); toast(`${t("registered")} · ${cname(c)}`);
}

    p.ownerIds=[b.id]; l.status="sold"; persist(); sheet=null; toast(t("contract_ok")); return render(); }
  // translation
  if(a==="trlang"){ sheet[el.dataset.who+"lang"]=el.dataset.v; return renderSheet(); }
  if(a==="trsave"){ const l=S.listings.find(l=>l.ofi.some(o=>o.d===TODAY)); const p=byId(S.properties,l.propertyId); const txt=[sheet.vheard, sheet.aheard].filter(Boolean).join(" / "); if(txt){ const o=l.ofi.find(o=>o.d===TODAY); const c=o.attendees[0]&&byId(S.contacts,o.attendees[0].contactId); if(c) noteOn(c,"Talk to me: "+txt); } sheet=null; toast(t("filed_ok")); return render(); }
});

  if(ev.target.id==="q"){ view.q=ev.target.value; const pos=ev.target.selectionStart; render(); const el=document.getElementById("q"); if(el){ el.focus(); try{el.setSelectionRange(pos,pos);}catch(e){} } return; }

  if(ev.target.id==="chq"){ sheet.q=ev.target.value; const pos=ev.target.selectionStart; renderSheet(); const el=document.getElementById("chq"); if(el){ el.focus(); try{el.setSelectionRange(pos,pos);}catch(e){} } return; }
  if(ev.target.id==="en_mobile"||ev.target.id==="en_email"){ const g=k=>document.getElementById(k)?.value??""; const pre={...(view.enqPre||{}), mobile:g("en_mobile"), email:g("en_email"), first:g("en_first"), last:g("en_last"), need:g("en_need"), pick:readPick()||(view.enqPre||{}).pick}; const ready=normMobile(pre.mobile).length>=10 || /@.+\./.test(pre.email); const was=normMobile((view.enqPre||{}).mobile||"").length>=10 || /@.+\./.test((view.enqPre||{}).email||""); view.enqPre=pre; if(ready!==was || ready){ const id=ev.target.id, pos=ev.target.selectionStart; render(); const el=document.getElementById(id); if(el){ el.focus(); try{el.setSelectionRange(pos,pos);}catch(e){} } } return; }

// ---------- real microphone: Web Speech API (Chrome / Safari, needs HTTPS or localhost) ----------
const VOICE_LANGS=[{code:"en-AU",label:"EN"},{code:"zh-CN",label:"普通话"},{code:"yue-Hant-HK",label:"粤语"}];
let voiceLang="en-AU"; try{ voiceLang=localStorage.getItem("ax_vlang")||"en-AU"; }catch(e){}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recFinal="", recInterim="", recErr="", holding=false, trWho=null;
function startRec(langCode){
  recFinal=""; recInterim=""; recErr="";
  if(!SR){ recErr=t("no_stt"); return; }
  rec = new SR(); rec.lang=langCode||voiceLang; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
  rec.onresult = e => { let fin="", inter=""; for(let i=0;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) fin+=r[0].transcript; else inter+=r[0].transcript; }
    recFinal=fin; recInterim=inter; const el=document.getElementById("interim"); if(el) el.textContent=(fin+" "+inter).trim(); const lr=document.getElementById("liveres"); if(lr) lr.innerHTML=cmdResults((fin+" "+inter).trim()); };
  rec.onerror = e => { if(e.error==="not-allowed"||e.error==="service-not-allowed") recErr=t("mic_denied"); else if(e.error!=="aborted"&&e.error!=="no-speech") recErr=e.error; };
  rec.onend = () => { if(holding){ try{ rec.start(); }catch(e){} return; } finishRec(); };
  try{ rec.start(); }catch(e){ recErr=String(e.message||e); }
}
function fakeTranslate(text, from, to){ if(!text) return ""; if(from===to) return text; const dict={"hello":"你好","how many bedrooms":"有几间卧室","when is the auction":"拍卖是什么时候","is the price negotiable":"价格可以谈吗","你好":"Hello","有几间卧室":"How many bedrooms?","多少钱":"How much is it?","什么时候拍卖":"When is the auction?"}; const k=text.toLowerCase().trim().replace(/[?？。.]/g,""); return dict[k] || (to.startsWith("zh")||to.startsWith("yue") ? "（翻译）"+text : "(translated) "+text); }
function finishRec(){
  const text=(recFinal+" "+recInterim).trim();
  rec=null;
  if(trWho && sheet && sheet.kind==="translate"){ const who=trWho; trWho=null; const other=who==="a"?"v":"a"; const from=sheet[who+"lang"], to=sheet[other+"lang"]; const out=fakeTranslate(text||(who==="a"?"How many bedrooms?":"多少钱？"),from,to);
    sheet[who+"heard"]=text||(who==="a"?"How many bedrooms?":"多少钱？"); sheet[other+"said"]=out; renderSheet(); try{ const u=new SpeechSynthesisUtterance(out); u.lang=to; speechSynthesis.speak(u); }catch(e){} return; }
  const ctx=ctxForVoice();
  sheet={kind:"cmd", ctx, text, err: recErr || (!text && SR ? t("nothing_heard") : "")};
  renderSheet();
  const ta=document.getElementById("tx"); if(ta && text){ ta.focus(); }
}
let pressTimer=null, listening=false;
document.addEventListener("pointerdown", ev => {
  const tm = ev.target.closest(".trmic"); if(tm){ ev.preventDefault(); if(holding) return; holding=true; listening=true; trWho=tm.dataset.who; tm.classList.add("live"); startRec(sheet[trWho+"lang"]); return; }
  const m = ev.target.closest("#mic,.micbtn"); if(!m) return; ev.preventDefault(); if(holding) return; holding=true; listening=false;
  pressTimer=setTimeout(()=>{ if(!holding) return; listening=true; m.classList.add("live"); sheet={kind:"listen", interim:""}; renderSheet(); startRec(); },260); });
function endHold(){ if(!holding) return; holding=false; clearTimeout(pressTimer); document.querySelectorAll(".live").forEach(m=>m.classList.remove("live"));
  if(!listening){ sheet={kind:"cmd", ctx:ctxForVoice(), text:""}; renderSheet(); setTimeout(()=>document.getElementById("tx")?.focus(),30); return; }
  if(rec){ try{ rec.stop(); }catch(e){ finishRec(); } setTimeout(()=>{ if(rec) finishRec(); },1500); } else finishRec(); }
document.addEventListener("pointerup", endHold); document.addEventListener("pointercancel", endHold);
// hidden translator: long-press the logo on the OFI screen
let logoTimer=null;
document.addEventListener("pointerdown", ev=>{ const lg=ev.target.closest("#ohlogo"); if(!lg) return; ev.preventDefault(); logoTimer=setTimeout(()=>{ sheet={kind:"translate", alang:"en-AU", vlang:"zh-CN"}; renderSheet(); },600); });
document.addEventListener("pointerup", ()=>clearTimeout(logoTimer)); document.addEventListener("pointercancel", ()=>clearTimeout(logoTimer));
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape"&&sheet){ sheet=null; renderSheet(); } });

render();
(function tick(){ const d=new Date(); const el=document.getElementById("clock"); if(el) el.textContent=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0"); setTimeout(tick,15000); })();
