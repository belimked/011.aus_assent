name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'prototype/**', 'tools/build-prototype-site.mjs', 'tools/proto-switcher.js', '.github/workflows/deploy.yml']
    tags: ['proto-v*']
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name aus-assent --branch main --commit-dirty=true

  deploy-mobile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要全部 proto-v* 标签和历史来生成各版本
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-prototype-site.mjs .proto-site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .proto-site --project-name aus-assent-mobile --branch main --commit-dirty=true
