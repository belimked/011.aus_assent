name: Mobile iOS Ad Hoc

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '!mobile/docs/**'
      - '.github/workflows/mobile-ios-adhoc.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mobile-ios-adhoc
  cancel-in-progress: true

env:
  TEAM_ID: 8J42Q87M5P
  CI: 1
  EXPO_NO_TELEMETRY: 1
  CF_PROJECT: agentcollect-install
  CF_BASE_URL: https://agentcollect-install.pages.dev

jobs:
  preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    outputs:
      signing: ${{ steps.secrets-check.outputs.signing }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck, lint and unit tests
        run: |
          npx tsc --noEmit
          npx expo lint
          npm test -- --ci
      - id: secrets-check
        name: Check signing secrets
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.AGENTCOLLECT_ADHOC_PROFILE_BASE64 }}
        run: |
          missing=()
          [ -n "$P12_BASE64" ] || missing+=(IOS_DIST_P12_BASE64)
          [ -n "$P12_PASSWORD" ] || missing+=(IOS_DIST_P12_PASSWORD)
          [ -n "$PROFILE_BASE64" ] || missing+=(AGENTCOLLECT_ADHOC_PROFILE_BASE64)
          if [ "${#missing[@]}" -eq 0 ]; then
            echo 'signing=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signing=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Set signing secrets: ${missing[*]}. See mobile/docs/ios-adhoc-manual.md"
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.signing == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci

      - name: Install signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.AGENTCOLLECT_ADHOC_PROFILE_BASE64 }}
        run: |
          for v in P12_BASE64 P12_PASSWORD PROFILE_BASE64; do
            [ -n "${!v}" ] || { echo "::error::Missing signing secret ($v)"; exit 1; }
          done
          P12="$RUNNER_TEMP/dist.p12"
          PROFILE="$RUNNER_TEMP/adhoc.mobileprovision"
          echo "$P12_BASE64" | base64 --decode > "$P12"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$P12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          EXPIRES=$(/usr/libexec/PlistBuddy -c 'Print ExpirationDate' "$RUNNER_TEMP/profile.plist")
          DEVICES=$(/usr/libexec/PlistBuddy -c 'Print ProvisionedDevices' "$RUNNER_TEMP/profile.plist" | grep -c -E '^\s+[0-9A-F-]{25,}' || true)
          echo "Profile $UUID · $DEVICES device(s) · expires $EXPIRES"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$PROFILE" "$d/$UUID.mobileprovision"
          done
          rm -f "$P12"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Generate native project
        run: npx expo prebuild -p ios --clean

      - name: Configure version and signing
        run: |
          BUNDLE_ID=$(node -p "require('./app.json').expo.ios.bundleIdentifier")
          [ -n "$BUNDLE_ID" ] || { echo '::error::Missing bundle ID in app.json'; exit 1; }
          shopt -s nullglob
          workspaces=(ios/*.xcworkspace)
          projects=(ios/*.xcodeproj)
          [ "${#workspaces[@]}" -eq 1 ] && [ "${#projects[@]}" -eq 1 ] || { echo '::error::Expected one top-level workspace and project after prebuild/pod install'; exit 1; }
          WORKSPACE="${workspaces[0]}"
          PROJECT="${projects[0]}"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          [ "$(basename "$PROJECT" .xcodeproj)" = "$SCHEME" ] || { echo '::error::Project and workspace names differ'; exit 1; }
          INFO_PLIST="ios/$SCHEME/Info.plist"
          [ -f "$INFO_PLIST" ] || { echo "::error::Missing $INFO_PLIST"; exit 1; }
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" "$INFO_PLIST"
          echo "APP_VERSION=$(plutil -extract CFBundleShortVersionString raw "$INFO_PLIST")" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install xcodeproj --no-document
          ruby ci/set-signing.rb "$PROJECT" "$TEAM_ID" "$PROFILE_UUID"

      - name: Archive
        run: |
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/agentCollect.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" -quiet archive

      - name: Export IPA
        run: |
          sed -e "s/__TEAM_ID__/$TEAM_ID/" -e "s/__BUNDLE_ID__/$BUNDLE_ID/" -e "s/__PROFILE_UUID__/$PROFILE_UUID/" \
            ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/agentCollect.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          mv "$RUNNER_TEMP"/export/*.ipa "$RUNNER_TEMP/agentCollect.ipa"
          ls -lh "$RUNNER_TEMP/agentCollect.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: agentCollect-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: ${{ runner.temp }}/agentCollect.ipa
          retention-days: 30

      - id: pages
        uses: actions/configure-pages@v5
      - name: Build install page
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          cp "$RUNNER_TEMP/agentCollect.ipa" "$SITE/"
          sips -z 57 57 assets/icon.png --out "$SITE/icon-57.png" > /dev/null
          sips -z 512 512 assets/icon.png --out "$SITE/icon-512.png" > /dev/null
          DATE=$(TZ=Australia/Brisbane date '+%-d %b %Y %H:%M')
          for f in index.html manifest.plist; do
            sed -e "s#__BASE_URL__#$BASE_URL#g" -e "s#__VERSION__#$APP_VERSION#g" -e "s#__BUILD__#${{ github.run_number }}#g" \
              -e "s#__BUNDLE_ID__#$BUNDLE_ID#g" -e "s#__DATE__#$DATE#g" "ci/install/$f" > "$SITE/$f"
          done
          echo "Install page: $BASE_URL/" >> "$GITHUB_STEP_SUMMARY"
          # Second copy for Cloudflare Pages (github.io is unreachable from some networks, e.g. mainland China).
          CF="$RUNNER_TEMP/site-cf"
          mkdir -p "$CF"
          cp "$SITE"/agentCollect.ipa "$SITE"/icon-*.png "$CF/"
          for f in index.html manifest.plist; do
            sed -e "s#__BASE_URL__#$CF_BASE_URL#g" -e "s#__VERSION__#$APP_VERSION#g" -e "s#__BUILD__#${{ github.run_number }}#g" \
              -e "s#__BUNDLE_ID__#$BUNDLE_ID#g" -e "s#__DATE__#$DATE#g" "ci/install/$f" > "$CF/$f"
          done
          echo "Install page (Cloudflare): $CF_BASE_URL/" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: install-site-cf
          path: ${{ runner.temp }}/site-cf
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Remove keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true

  deploy-cloudflare:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: install-site-cf
          path: site-cf
      - name: Create Cloudflare Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create "$CF_PROJECT" --production-branch main || true
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-cf --project-name ${{ env.CF_PROJECT }} --branch main --commit-dirty=true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
