name: Web console E2E
on:
  push:
    paths: ['web/**', 'server/**', '.github/workflows/web-e2e.yml']
  pull_request:
    paths: ['web/**', 'server/**', '.github/workflows/web-e2e.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playwright:
    # Playwright 1.59 has no browser build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/e2e/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install dependencies
        run: npm ci --prefix web && npm ci --prefix web/e2e --include=dev
      - name: Install browser
        working-directory: web/e2e
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: web/e2e
        run: npm test
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            web/e2e/playwright-report/
            web/e2e/test-results/
