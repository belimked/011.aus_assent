# To-dos: create, complete (Done), undo, reassign to John.
appId: com.placesunnybank.agentcollect
name: 04 to-dos
---
- runFlow: common/reset.yaml
- tapOn:
    id: home-todos
- scrollUntilVisible:
    element: '\+ To-do'
    direction: DOWN
    centerElement: true
- tapOn: '\+ To-do'
- tapOn:
    id: todo-title
- inputText: E2E follow-up task
# Return dismisses the single-line keyboard before scrolling to the save action.
- pressKey: Enter
- scrollUntilVisible:
    element: Save to-do
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn: Save to-do
# The toast lasts only 2.5 s; verify the sheet closes and the row exists instead.
- extendedWaitUntil:
    notVisible: New to-do
    timeout: 10000
- scrollUntilVisible:
    element: 'E2E follow-up task.*'
    direction: DOWN
# Done (multi-select → Complete), then Undo from the toast.
- tapOn: Select
# Select mode adds a dock. The row is fully visible above it; asking Maestro to
# center it loops forever when this short list cannot scroll any farther.
- scrollUntilVisible:
    element: 'E2E follow-up task.*'
    direction: DOWN
- tapOn: 'E2E follow-up task.*'
- tapOn: Complete 1
- assertVisible: 1 done · moved to Completed
- tapOn: Undo
- scrollUntilVisible:
    element: 'E2E follow-up task.*'
    direction: DOWN
# Reassign to John.
- tapOn: Select
- scrollUntilVisible:
    element: 'E2E follow-up task.*'
    direction: DOWN
- tapOn: 'E2E follow-up task.*'
- tapOn: Reassign
- extendedWaitUntil:
    visible: John
    timeout: 15000
- tapOn: John
- extendedWaitUntil:
    visible: To-do sent to John
    timeout: 10000
- scrollUntilVisible:
    element: 'Assigned by me.*'
    direction: UP
    centerElement: true
- tapOn: 'Assigned by me.*'
- scrollUntilVisible:
    element: 'E2E follow-up task.*'
    direction: DOWN
- assertVisible: 'E2E follow-up task.*'
