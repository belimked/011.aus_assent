# Full-screen map: the selected-home preview card floats at the top-left over the map.
appId: com.placesunnybank.agentcollect
name: 05 full-screen map
---
- runFlow: common/reset.yaml
- tapOn: DK
# Bring the map entry above the tab bar. Centering can loop if the DK list
# cannot scroll far enough (as with short seeded lists).
- scrollUntilVisible:
    element:
      id: dk-fullmap
    direction: DOWN
    visibilityPercentage: 60
- waitForAnimationToEnd
- tapOn:
    id: dk-fullmap
- tapOn:
    id: map-search
- waitForAnimationToEnd
- inputText: 12 Gager
- pressKey: Enter
# Map rerenders can interrupt Maestro's typing (e.g. "1ager" instead of
# "12 Gager"). Retry the query once if no matching preview was selected.
- extendedWaitUntil:
    visible:
      id: map-preview
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible:
        id: map-preview
    commands:
      - tapOn:
          id: map-search
      - eraseText: 30
      - inputText: 12 Gager
      - pressKey: Enter
- extendedWaitUntil:
    visible:
      id: map-preview
    timeout: 15000
- assertVisible:
    id: map-preview
    below:
      id: map-search
- assertVisible: 12 Gager St, Sunnybank
# Visual evidence of the card over the map (artifact: screenshots/).
- takeScreenshot: 05-map-preview-top-left
- tapOn: '\+ Note'
- extendedWaitUntil:
    visible: 'Add note · 12 Gager St'
    timeout: 10000
- tapOn:
    id: note-text
- inputText: Map E2E note
- tapOn:
    id: note-save
# Filed: the follow-up sheet opens.
- extendedWaitUntil:
    visible: Dismiss
    timeout: 10000
# A tap while the sheet is still sliding in is ignored.
- waitForAnimationToEnd
- tapOn: Dismiss
- extendedWaitUntil:
    notVisible: Dismiss
    timeout: 10000
- tapOn: 'Open record ›'
- extendedWaitUntil:
    visible: 12 Gager St, Sunnybank
    timeout: 10000
- tapOn:
    id: header-back
- tapOn:
    id: map-preview-close
- assertNotVisible:
    id: map-preview
