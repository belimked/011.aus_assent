# Door knock: pick 12 Gager St, type the knock, approve ("Saved"), then add a note on the record.
appId: com.placesunnybank.agentcollect
name: 02 door knock
---
- runFlow: common/reset.yaml
- tapOn: DK
- tapOn: Change
- tapOn:
    id: change-search
- inputText: 12 Gager
- tapOn:
    id: change-p6
- tapOn:
    id: dk-capture
- extendedWaitUntil:
    visible:
      id: dk-description
    timeout: 10000
- assertVisible: 'Say it or type it.*'
- tapOn:
    id: dk-description
- inputText: Spoke to Mary Chen at the door. Mobile 0412 555 019. Kids moved out.
- hideKeyboard
- tapOn:
    id: dk-record
# AI extraction is not configured on the CI server: the offline parser is used.
- extendedWaitUntil:
    visible: Check before saving
    timeout: 30000
# The seed has two Mary Chen records with this mobile: approving needs a chosen contact.
# Each match row is one accessibility element: "Mary Chen, Matched mobile · Mary, Use".
- tapOn:
    text: 'Mary Chen, Matched mobile.*'
    index: 0
- assertVisible: '.*Selected'
- scrollUntilVisible:
    element:
      id: dk-approve
    direction: DOWN
# A tap while the scroll is still settling only stops the scroll.
- waitForAnimationToEnd
- tapOn:
    id: dk-approve
# Filed: the follow-up sheet opens (the 2.5 s "Saved" toast is too brief to assert reliably).
- extendedWaitUntil:
    visible: Dismiss
    timeout: 10000
# A tap while the sheet is still sliding in is ignored.
- waitForAnimationToEnd
- tapOn: Dismiss
- extendedWaitUntil:
    notVisible: Dismiss
    timeout: 10000
- tapOn:
    id: dk-address
- extendedWaitUntil:
    visible: 12 Gager St, Sunnybank
    timeout: 10000
- scrollUntilVisible:
    element:
      id: property-note
    direction: DOWN
- tapOn:
    id: property-note
- inputText: E2E door knock note
# Return on the keyboard ends editing (single-line field). hideKeyboard's swipe can hit
# buttons on this screen, and a tap on the covered Add button would type a key instead.
- pressKey: Enter
- tapOn:
    id: property-note-save
- extendedWaitUntil:
    visible: E2E door knock note
    timeout: 10000
