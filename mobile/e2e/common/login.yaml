# Fresh install state + signed in as Mary against the seeded CI server.
# clearState does not wipe the iOS keychain (expo-secure-store token), so clear it too.
appId: com.placesunnybank.agentcollect
---
- clearKeychain
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 60000
- tapOn:
    id: login-email
- inputText: mary@axleo.local
- tapOn:
    id: login-password
- inputText: ${E2E_PASSWORD}
# Keep the password keyboard from covering the submit button on smaller simulators.
- pressKey: Enter
- tapOn:
    id: login-submit
# iOS may show the system "Save Password?" sheet over the app after sign-in; dismiss it if it appears.
- extendedWaitUntil:
    visible: Not Now
    # On the first launch after boot the sheet has taken more than 9 s to appear.
    timeout: 15000
    optional: true
- tapOn:
    text: Not Now
    optional: true
# The iOS password prompt or a keyboard can consume the submit tap. Retry only if
# still on the sign-in form; do not clear app data or retype into an already-signed-in app.
- runFlow:
    when:
      visible:
        id: login-email
    commands:
      - tapOn:
          id: login-submit
      - tapOn:
          text: Not Now
          optional: true
- extendedWaitUntil:
    visible: MY ACTIVITY
    timeout: 20000
    optional: true
# A failed sign-in leaves the form in place (e.g. transient network error or a
# delayed iOS password prompt). Re-enter credentials only in that case.
- runFlow:
    when:
      visible:
        id: login-email
    commands:
      - tapOn:
          id: login-email
      - eraseText: 100
      - inputText: mary@axleo.local
      - tapOn:
          id: login-password
      - eraseText: 100
      - inputText: ${E2E_PASSWORD}
      - pressKey: Enter
      - tapOn:
          id: login-submit
      - tapOn:
          text: Not Now
          optional: true
- extendedWaitUntil:
    visible: MY ACTIVITY
    timeout: 60000
# First pull finished: the to-dos link shows the seeded count.
- extendedWaitUntil:
    visible:
      id: home-todos
    timeout: 30000
