# From Home: Me → Sign out. Ends on the login screen.
appId: com.placesunnybank.agentcollect
---
# A late iOS "Save Password?" sheet can still be over Home.
- tapOn:
    text: Not Now
    optional: true
- tapOn:
    id: open-me
- extendedWaitUntil:
    visible: Language
    timeout: 5000
    optional: true
# The first tap can land during the Home transition without navigating.
- runFlow:
    when:
      visible:
        id: open-me
    commands:
      - tapOn:
          id: open-me
- extendedWaitUntil:
    visible: Language
    timeout: 15000
- scrollUntilVisible:
    element:
      id: logout
    direction: DOWN
    visibilityPercentage: 50
- waitForAnimationToEnd
- tapOn:
    id: logout
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 30000
