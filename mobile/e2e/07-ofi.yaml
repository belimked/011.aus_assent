# OFI check-in: register a new visitor at today's open home.
appId: com.placesunnybank.agentcollect
name: 07 OFI check-in
---
- runFlow: common/reset.yaml
- tapOn: OFI
# Outside the live window the first tap only unlocks check-in; tap again in that case.
- tapOn: Start check-in
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: ofi-mobile
    commands:
      - tapOn: Start check-in
- extendedWaitUntil:
    visible:
      id: ofi-mobile
    timeout: 15000
# The keyboard covers the fields below Mobile, and the phone pad has no key that
# hides it: after each field, tap the "Mobile *" label (plain text in the scroll view)
# to dismiss the keyboard before tapping the next field.
- tapOn:
    id: ofi-mobile
- inputText: '0499111222'
- tapOn: 'Mobile \*'
- tapOn:
    id: ofi-first
- inputText: E2E
- tapOn: 'Mobile \*'
- tapOn:
    id: ofi-last
- inputText: Visitor
- tapOn: 'Mobile \*'
- tapOn:
    id: ofi-email
- inputText: e2e.visitor@example.test
- tapOn: 'Mobile \*'
- scrollUntilVisible:
    element:
      id: ofi-register
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: ofi-register
# Registered: back on the OFI list; the visitor is in this open home's attendee list.
- extendedWaitUntil:
    notVisible:
      id: ofi-register
    timeout: 10000
- tapOn:
    text: Attendees
    index: 0
# The attendee row reads "E2E Visitor 0499 111 ••••".
- scrollUntilVisible:
    element: 'E2E Visitor.*'
    direction: DOWN
