# Review queue (offline voice captures): approve one, swipe-dismiss another.
appId: com.placesunnybank.agentcollect
name: 08 review queue
---
- runFlow: common/reset.yaml
- tapOn:
    id: home-captures
- extendedWaitUntil:
    visible:
      id: capture-v1
    timeout: 15000
# Candidate cards now precede the action buttons; bring Approve into view first.
- scrollUntilVisible:
    element:
      id: capture-approve-v1
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: capture-approve-v1
# With multiple matching contacts, Approve opens the full review sheet.
- extendedWaitUntil:
    visible: Review voice capture
    timeout: 10000
- scrollUntilVisible:
    element: Use contact
    direction: DOWN
- tapOn:
    text: Use contact
    index: 0
- scrollUntilVisible:
    element: Approve
    direction: DOWN
- waitForAnimationToEnd
- tapOn: Approve
- extendedWaitUntil:
    notVisible: Review voice capture
    timeout: 10000
- assertNotVisible:
    id: capture-v1
- swipe:
    from:
      id: capture-v2
    direction: LEFT
    duration: 400
- extendedWaitUntil:
    visible: Capture dismissed
    timeout: 10000
- assertNotVisible:
    id: capture-v2
