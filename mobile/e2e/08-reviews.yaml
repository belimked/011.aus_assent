# Review queue (offline voice captures): approve one, swipe-dismiss another.
appId: com.placesunnybank.agentcollect
name: 08 review queue
---
- runFlow: common/reset.yaml
- tapOn:
    id: home-captures
- extendedWaitUntil:
    visible:
      id: capture-v1
    timeout: 15000
- tapOn:
    id: capture-approve-v1
# The seed has two Mary Chen records with 0412 555 019, so approving opens the review sheet
# and asks which contact to use.
- extendedWaitUntil:
    visible: Choose a matching contact
    timeout: 10000
- tapOn: 'Mary Chen · 0412 555 .* · ma.*@example\.com.*'
- scrollUntilVisible:
    element: Approve
    direction: DOWN
- waitForAnimationToEnd
- tapOn: Approve
- extendedWaitUntil:
    notVisible: Review voice capture
    timeout: 10000
- assertNotVisible:
    id: capture-v1
- swipe:
    from:
      id: capture-v2
    direction: LEFT
    duration: 400
- extendedWaitUntil:
    visible: Capture dismissed
    timeout: 10000
- assertNotVisible:
    id: capture-v2
